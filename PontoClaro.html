function contexto(){const m=me(),R=S.regras;return `Você é ${S.empresa.assistente}, a assistente virtual do sistema de ponto da empresa ${S.empresa.nome} (sistema PontoClaro). Fale na primeira pessoa como ${S.empresa.assistente}, simpática e direta. O sistema faz: controle de ponto, escalas, treinamento e contratos para pequenas empresas brasileiras. Responda em português do Brasil, de forma clara, curta e passo a passo, como quem explica para alguém vendo o sistema pela primeira vez. No máximo 6 frases ou uma lista numerada curta. Não invente funções que não existem.
Usuário: ${m.nome}, perfil ${ROLE_LABEL[m.role]} (${m.cargo}). Tela aberta: ${TITLES[page]}.
Telas (menu à direita): Página de início; Controle de ponto (4 batidas: Entrada, Saída almoço, Volta almoço, Saída; "Solicitar ajuste" para batidas esquecidas); Folha de ponto (mês inteiro de uma pessoa; gestor e líder corrigem qualquer horário direto na folha, escolhem com caixas de seleção o que entra — batidas, turno, horas, extras, noturno, débito, situação, observações, valores em R$, assinaturas — e geram PDF (uma pessoa, todos ou escolher quem) com logo da empresa, baixam Excel ou copiam o texto para WhatsApp/e-mail); se alguém não bateu, líder/gestor clicam em "Lançar" ao lado do nome na Página de início e lançam os horários na hora; Escalas (turno de cada pessoa por dia, escolhido numa lista; líder/gestor edita e publica); Treinamento; Contrato; RH · Guia de uso; Equipe e acessos (abas Gestores, Líderes, Colaboradores e Equipes; ficha cadastral: nome, CPF que é o login, cargo, equipe, perfil, salário, admissão; gestor gera nova senha; na aba Equipes o gestor cria equipes e define o líder de cada uma); Empresa (abas: Dados e identidade com logo, cor, razão social, CNPJ; Regras de horas; Turnos; Cargos; Equipes); Fechamento (totais do mês, aprovação de ajustes, exportar Excel); QR Code (cartaz da portaria; o colaborador aponta a câmera, entra com CPF e senha uma vez e depois cai direto no botão de bater); Ofertas e planos (mensal: Básico R$49, Profissional R$129, Empresa R$299; anual com 2 meses grátis: R$470, R$1.240, R$2.870, implantação incluída; módulo opcional Guias e contas a pagar +R$20/mês ou +R$200/ano, ativado por uma chave na própria aba; colaborador extra R$3,90/mês; 14 dias grátis); Central de ajuda.
Jornada automática (registro por exceção, Empresa › Regras de horas): quando ligada, dia sem batida conta como a jornada normal do turno escalado (status AUTOMÁTICO, horários do turno em cinza na folha); só exceções são lançadas; líder/gestor marcam falta pelo botão "Falta" na Página de início; feriados, folgas, férias e abonos não entram. Quando desligada, dia sem batida vira FALTA.
Férias e ASO (aba Férias e exames, líder/gestor): o sistema calcula período aquisitivo de 12 meses e prazo de concessão (23 meses da admissão), avisa com 90 dias e marca vencidas; "+ Lançar férias" coloca os dias na folha como FÉRIAS; exames ASO têm data, tipo e validade, com aviso 30 dias antes de vencer. Guias e contas a pagar (módulo opcional, +R$20/mês, ativado em Ofertas e planos; aba do gestor): DAS, FGTS, INSS, aluguel, energia etc. por CNPJ, com total em aberto por empresa, aviso na Página de início um dia antes do vencimento e no vencimento, marcar como paga, repetir mensalmente. Tour de boas-vindas: no primeiro acesso a assistente mostra passo a passo o que a pessoa precisa aprender; pode refazer em Central de ajuda.
Vários CNPJs: em Empresa › Dados e identidade › CNPJs do grupo, o gestor cadastra matriz, filiais ou outras empresas do mesmo dono; na ficha de cada pessoa escolhe o CNPJ dela; folha, contrato e termos saem com o CNPJ certo; Fechamento e Folha têm filtro por CNPJ; um único plano cobre todos os CNPJs, cobrado pelo total de colaboradores.
Documentos legais: na aba Contrato há o Termo de Autorização do ponto + LGPD (cada colaborador aceita no primeiro acesso; cobre registro eletrônico pela CLT art. 74 §2º e Portaria 671, uso opcional do celular pessoal sem custo e sem acesso a outros dados, e tratamento de dados pela LGPD), a Política de Privacidade e, para o gestor, o Contrato de Adesão ao PontoClaro; todos podem ser vistos e baixados em PDF, e o aceite fica registrado com data, hora e login. Importar do relógio físico: no Controle de ponto, líder/gestor clicam "Importar do relógio (foto/PDF)", enviam foto ou PDF da folha do relógio, a IA lê os horários, mostra uma tabela para conferir e grava os pontos.
Feriados: em Empresa › Regras de horas › Feriados, o gestor cadastra data, nome e tipo opcional (nacional, estadual, municipal, ponto facultativo, folga coletiva, feriado da empresa) e marca se conta como feriado (paga adicional) ou é dia normal. Jornadas: em Empresa › Turnos, cada jornada é Fixa (horários definidos) ou Flexível (só carga de horas por dia, horário livre); pode haver quantas jornadas quiser e a Folga existe em toda escala.
Treinamento: o gestor cria, edita e exclui módulos em Treinamento (+ Novo módulo): título, duração, descrição, obrigatório ou não, para quem vale, link de vídeo/material (YouTube, Drive, PDF) ou texto, ou o "Tutorial animado: como bater o ponto" (passo a passo animado numa tela de celular, com narração em voz opcional). Progresso por pessoa aparece para líder e gestor. Horas extras, noturno, faltantes e saldo são calculados automaticamente mas aparecem só para líder e gestor; o colaborador vê batidas, horas trabalhadas e situação simples (OK, REGISTRADO, FALTA, ABONADO).
Hora extra programada: em Escalas, líder/gestor clicam "+ Escalar para hora extra", marcam as pessoas, dia, horário e motivo; cada pessoa recebe o aviso na Página de início e responde "Confirmo, vou" ou "Não posso"; no Controle de ponto e na folha, extras de dia com convocação aparecem com ✓ (autorizada) e sem convocação com "?"; o Fechamento conta os dias de extra sem convocação.
Atestados: o colaborador clica em "Enviar atestado" no Controle de ponto, marca os dias, anexa foto ou PDF e envia; líder/gestor aprovam na Página de início ou em Fechamento › Pendências, e os dias ficam ABONADOS (sem desconto). Líder e gestor corrigem qualquer horário direto na tabela do Controle de ponto, na Folha de ponto ou pelo botão "Corrigir ponto de alguém", sem pedido de ajuste; tudo vai para o Histórico de correções no Fechamento. Colaborador não vê o Fechamento nem valores em dinheiro.
Perfis: Colaborador vê só o próprio; Líder vê a própria equipe, monta escala e aprova ajustes; Gestor vê e configura tudo.
Regras atuais: jornada ${R.jornada} seg–sex, sábado ${R.jornadaSab}, tolerância ${R.tol} min; extra +${R.extraSem}% dia útil, +${R.extraSab}% sábado, +${R.extraDom}% domingo, +${R.extraFer}% feriado; adicional noturno +${R.noturno}% entre ${R.notIni} e ${R.notFim}; valor-hora = salário ÷ ${R.divisor}. Turnos cadastrados: ${S.turnos.map(t=>t.nome).join(", ")}. Esta versão é controle interno; registro oficial (Portaria 671) está no plano Empresa.
Hoje do usuário: batidas ${JSON.stringify(S.punches[`${m.id}|${todayStr()}`]||[])}; ajustes pendentes: ${S.ajustes.filter(a=>a.st==="pendente").length}.`}
function localAnswer(q){const t=q.toLowerCase(),R=S.regras;
  for(const[fq,fa]of FAQ){if(fq.toLowerCase().split(" ").filter(w=>w.length>4).some(w=>t.includes(w)))return fa}
  if(/noturn/.test(t))return `Horas entre ${R.notIni} e ${R.notFim} recebem +${R.noturno}%. O sistema conta só os minutos dentro dessa faixa a partir das batidas, então um turno 22h–06h tem 7 horas noturnas e 1 hora normal. O valor aparece na coluna "Valor noturno" do Fechamento.`;
  if(/logo|cor|cnpj|empresa/.test(t))return "Em Empresa › Dados e identidade você envia o logo (PNG/JPG até 400 KB), escolhe a cor principal e preenche razão social, CNPJ, endereço e contatos. A cor muda botões, menu e a tela de login na hora.";
  if(/cadastr|pessoa|ficha|cpf/.test(t))return "Em Equipe e acessos clique em + Nova pessoa e preencha a ficha: nome, CPF (vira o login), cargo, equipe, perfil, salário, admissão e uma senha inicial. A pessoa já pode entrar e trocar a senha pelo botão Senha no topo.";
  if(/senha/.test(t))return "A senha só a própria pessoa conhece. Se esquecer, o gestor abre Equipe e acessos, clica em Senha ao lado do nome e define uma provisória. Cada um troca a própria senha pelo botão Senha no topo da tela.";
  if(/qr/.test(t))return "Na aba QR Code o gestor imprime o cartaz. O colaborador aponta a câmera, entra com CPF e senha uma vez e, dali em diante, abre direto numa tela com um único botão mostrando a próxima batida.";
  if(/turno|escala/.test(t))return "Turnos ficam em Empresa › Turnos: crie quantos quiser com os horários (manhã, tarde, noite, 12x36…). Depois, em Escalas, escolha o turno de cada pessoa por dia e clique em Publicar. Colaboradores só visualizam.";
  if(/autom[aá]tic|exce[çc][ãa]o|n[ãa]o bate/.test(t))return "Em Empresa › Regras de horas, ligue Jornada automática: dia sem batida passa a contar como a jornada normal do turno da pessoa (aparece como AUTOMÁTICO, com os horários do turno em cinza). Só o que foge do normal precisa ser lançado: falta (botão Falta na Página de início), atestado, extra ou correção. A CLT permite isso com acordo escrito, e o Termo de Autorização já prevê.";
  if(/f[ée]rias/.test(t))return "Em Férias e exames (ASO) o sistema mostra, para cada pessoa, quando termina o período aquisitivo e até quando a empresa precisa conceder as férias; avisa com 90 dias e marca vencidas. Clique em + Lançar férias, escolha a pessoa, o início e os dias: os dias entram na folha como FÉRIAS.";
  if(/aso|exame/.test(t))return "Na mesma aba de Férias, em Exames ocupacionais, clique em Registrar exame: data, tipo (admissional, periódico…) e validade em meses. O sistema avisa na Página de início 30 dias antes de vencer.";
  if(/guia|boleto|conta a pagar|das|fgts|vencimento/.test(t))return "Em Guias e contas a pagar o gestor lança impostos e contas por CNPJ (nome, valor, vencimento, repetir mensalmente). No alto aparece o total em aberto de cada empresa; a Página de início avisa um dia antes de vencer e quando vence. Marcar como paga cria a do mês seguinte se for recorrente.";
  if(/cnpj|filial|matriz|duas empresas|outra empresa/.test(t))return "Em Empresa › Dados e identidade, na parte CNPJs do grupo, clique em + Adicionar CNPJ e preencha apelido, razão social, CNPJ e endereço. Depois, na ficha de cada pessoa (Equipe e acessos), escolha a empresa dela. A folha, o contrato e os termos saem com o CNPJ certo, e o Fechamento tem filtro por CNPJ. Um plano só cobre todos.";
  if(/lgpd|termo|contrato de ades|privacidade|autoriza/.test(t))return "Na aba Contrato estão o Termo de Autorização do ponto (CLT art. 74 §2º, Portaria 671, uso opcional do celular e LGPD), a Política de Privacidade e o Contrato de Adesão. Cada colaborador aceita o termo no primeiro acesso e o aceite fica registrado com data, hora e login; tudo pode ser baixado em PDF.";
  if(/rel[óo]gio|importar|foto|pdf do ponto/.test(t))return "No Controle de ponto, clique em Importar do relógio (foto/PDF), envie a foto da folha ou o PDF do relatório do relógio físico. Eu leio os horários, mostro uma tabela para você conferir pessoa, data e batidas, e gravo tudo de uma vez.";
  if(/feriado|facultativo/.test(t))return "Em Empresa › Regras de horas, na parte Feriados, informe a data, o nome e, se quiser, o tipo (nacional, estadual, municipal, ponto facultativo…). Marque 'Conta como feriado' para pagar o adicional a quem trabalhar; ponto facultativo e folga coletiva entram como dia normal. O feriado aparece na escala e no cálculo automaticamente.";
  if(/flex[ií]vel|jornada fixa|jornadas/.test(t))return "Em Empresa › Turnos crie jornadas Fixas (com horários) ou Flexíveis (só a carga por dia, ex. 08:48, em qualquer horário). Depois, na Escala, escolha a jornada de cada pessoa por dia; a Folga já é uma opção em todos os dias.";
  if(/treinamento|módulo|modulo|tutorial|v[ií]deo/.test(t))return me().role==="gestor"?"Em Treinamento clique em + Novo módulo: título, duração, descrição, se é obrigatório, para quem vale e o material (link de vídeo do YouTube/Drive, PDF ou um texto). Tem também o Tutorial animado de como bater o ponto, com narração em voz, pronto para você incluir. Edite ou exclua qualquer módulo pelo botão Editar.":"Em Treinamento aparecem seus módulos. Toque em Iniciar módulo para ver o vídeo ou texto, e em Concluí este módulo ao terminar. O tutorial de como bater o ponto é animado e pode ser ouvido com narração.";
  if(/escalar|convoc|programar.*extra|extra.*program/.test(t))return "Em Escalas, clique em + Escalar para hora extra: marque as pessoas, o dia, início, fim e o motivo. Cada uma vê o aviso ao entrar e responde Confirmo ou Não posso; você acompanha quem confirmou na mesma tela. A extra daquele dia entra no fechamento como autorizada (✓).";
  if(/atestado|abon|justific|declara/.test(t))return "No Controle de ponto clique em Enviar atestado: escolha o tipo, marque do dia até o dia, anexe a foto ou PDF se quiser e envie. O líder recebe na hora e aprova com um toque; os dias ficam abonados na folha, sem desconto. Você acompanha o status em Meus atestados.";
  if(/pdf/.test(t))return "Na Folha de ponto escolha Uma pessoa, Todos os colaboradores ou Escolher quem vai, marque o que deve aparecer e clique em Salvar em PDF. Sai um PDF com uma folha por pessoa, com o logo e a cor da empresa, totais e linhas de assinatura.";
  if(/folha|corrig|contador|mandar|enviar|baixar/.test(t))return "Na Folha de ponto escolha a pessoa e o mês. Gestor e líder clicam em qualquer horário e digitam o certo; a folha recalcula na hora. Marque o que deve aparecer (batidas, extras, valores, assinaturas…) e use Baixar para Excel ou Copiar texto para mandar por WhatsApp ou e-mail.";
  if(/bat|ponto|entrada|sa[ií]da/.test(t))return "Na tela Controle de ponto você bate 4 vezes: Entrada, Saída almoço, Volta almoço e Saída. O botão certo fica destacado; os outros ficam bloqueados. Pelo QR Code é um botão só.";
  if(/ajuste|esquec/.test(t))return "Clique em Solicitar ajuste no Controle de ponto, informe a data, o horário correto e o motivo. O pedido vai para o líder, que aprova ou recusa em Fechamento.";
  if(/fechamento|extra|valor|relat|sábado|sabado|domingo|feriado/.test(t))return `O Fechamento soma por pessoa: horas, extras, noturno, débito e saldo. Extras usam o percentual do dia: +${R.extraSem}% útil, +${R.extraSab}% sábado, +${R.extraDom}% domingo, +${R.extraFer}% feriado. Valor = horas × (salário ÷ ${R.divisor}) × (1 + %).`;
  if(/l[ií]der|gestor|perfil|acesso|permiss/.test(t))return "Três perfis: Colaborador (vê só o que é dele), Líder (vê a equipe, monta escala, aprova ajustes) e Gestor (vê tudo, configura a empresa, fecha o mês, QR Code).";
  if(/plano|pre[çc]o|oferta|quanto|anual|mensal/.test(t))return "Mensal: Básico R$ 49 (até 10 pessoas), Profissional R$ 129 (até 40) e Empresa R$ 299 (ilimitado). Anual com 2 meses grátis: R$ 470, R$ 1.240 e R$ 2.870. O módulo Guias e contas a pagar é opcional: + R$ 20/mês (ou R$ 200/ano), ativado por uma chave em Ofertas e planos. Tem 14 dias grátis.";
  if(/tour|funciona|come[çc]|primeir|passo/.test(t))return `Para ${ROLE_LABEL[me().role]}: 1) Página de início para o resumo; 2) Controle de ponto para bater ou conferir; 3) Escalas para a semana; 4) Treinamento; 5) Contrato.${me().role!=="colab"?" Na gestão: RH · Guia, Equipe e acessos, Empresa, Fechamento e QR Code.":""} O guia completo está em RH · Guia de uso.`;
  return "Posso explicar qualquer tela: pergunte sobre bater ponto, escalas, turnos, cadastro de pessoas, adicional noturno, fechamento, QR Code ou planos.";
}
async function send(q){
  addMsg("u",q);const bubble=addMsg("a","Pensando…");const status=document.getElementById("aiStatus");turns.push({role:"user",content:q});
  if(sampleFn===null&&window.claude?.use){try{sampleFn=(await claude.use("sample"))||false}catch(e){sampleFn=false}}
  if(!sampleFn){const a=localAnswer(q);bubble.textContent=a;turns.push({role:"assistant",content:a});status.textContent="Respostas guiadas (IA ao vivo indisponível aqui)";return}
  ctl=new AbortController();status.textContent="IA respondendo…";
  try{const {text}=await sampleFn([{role:"user",content:contexto()},...turns.slice(-10)],{cache:false,modelTier:"quick",signal:ctl.signal,onText:({text})=>{bubble.textContent=text;aiLog.scrollTop=aiLog.scrollHeight}});turns.push({role:"assistant",content:text});status.textContent="Pergunte como usar qualquer tela"}
  catch(e){if(e.code==="cancelled"){bubble.textContent=e.text||"(cancelado)";return}if(["not_granted","sampling_disabled","not_declared","capability_disabled"].includes(e.code))sampleFn=false;const a=localAnswer(q);bubble.textContent=a;turns.push({role:"assistant",content:a});status.textContent=sampleFn===false?"Respostas guiadas (IA ao vivo não autorizada)":"IA indisponível agora; resposta guiada"}
}
boot();
