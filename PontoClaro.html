<title>PontoClaro</title>
<style>[hidden]{display:none!important}body{margin:0;font-family:system-ui,sans-serif}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* Layout: app shell — content column + navigation rail on the RIGHT, assistant docked bottom-left. Accent is the company's color. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#e9eeec; --fg:#17201d; --muted:#5f6d68; --line:#d6ddda;
  --accent:#0f766e; --accent-fg:#ffffff; --accent-soft:color-mix(in srgb,var(--accent) 16%,var(--surface));
  --ok:#1f8a4c; --ok-soft:#dcf2e4; --warn:#b7791f; --warn-soft:#fbeed4; --bad:#c0392b; --bad-soft:#f9dfdb; --info:#2a5db0; --info-soft:#dde7f8; --night:#5b4bb5; --night-soft:#e6e1f7;
  --display:"Sora",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
  --r:10px; --nav-w:230px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101614; --surface:#182019; --surface-2:#1f2a25; --fg:#e8edeb; --muted:#9aa8a2; --line:#2b3732;
  --ok:#4fd07f; --ok-soft:#153726; --warn:#e3a84a; --warn-soft:#3b2d12; --bad:#ef6a5a; --bad-soft:#3d1a16; --info:#6f9ae6; --info-soft:#1a2a45; --night:#a596f0; --night-soft:#2a2347;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#182019; --surface-2:#1f2a25; --fg:#e8edeb; --muted:#9aa8a2; --line:#2b3732;
  --ok:#4fd07f; --ok-soft:#153726; --warn:#e3a84a; --warn-soft:#3b2d12; --bad:#ef6a5a; --bad-soft:#3d1a16; --info:#6f9ae6; --info-soft:#1a2a45; --night:#a596f0; --night-soft:#2a2347;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:24px;font-weight:700}h2{font-size:17px;font-weight:600}h3{font-size:14px;font-weight:600}
p{margin:0}button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=color]{padding:2px;height:38px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.num{font-variant-numeric:tabular-nums}

.shell{display:flex;min-height:100%}
main{flex:1;min-width:0;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
nav.rail{width:var(--nav-w);flex:none;background:var(--surface);border-left:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;padding:16px 12px;padding-right:max(12px,env(safe-area-inset-right,0px));gap:3px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
.brand .logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--display);font-weight:700;overflow:hidden;flex:none}
.brand .logo img{width:100%;height:100%;object-fit:cover}
.brand b{font-family:var(--display);font-size:15px;line-height:1.1;display:block}
.brand small{display:block;color:var(--muted);font-size:11px}
.nav-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--fg);font-weight:500}
.navbtn svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.navbtn:hover{background:var(--surface-2)}
.navbtn.active{background:var(--accent-soft);color:var(--accent)}
.navbtn.active svg{color:var(--accent)}
.navbtn .pill{margin-left:auto;font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.rail-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.topbar .grow{flex:1;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.who{display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:600;font-size:12px;color:var(--accent);flex:none}
.menu-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.soft{background:var(--surface-2);border-color:transparent}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700}.stat .l{font-size:12px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 14px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.lg{padding:16px 24px;font-size:17px;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.neutral{background:var(--surface-2);color:var(--muted)}.chip.night{background:var(--night-soft);color:var(--night)}.chip.accent{background:var(--accent-soft);color:var(--accent)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}.small{font-size:12px}
.sect-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lead{color:var(--muted);max-width:62ch}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:500;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;text-align:center}

.clock{font-family:var(--display);font-size:56px;font-weight:700;letter-spacing:-.02em;line-height:1}
.punch-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.punch{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.punch .t{font-family:var(--display);font-size:20px;font-weight:600}.punch .k{font-size:12px;color:var(--muted)}
.punch.done{background:var(--ok-soft);border-color:transparent}
.punch.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.punch[disabled]{opacity:.55;cursor:not-allowed}

.escala{display:grid;grid-template-columns:170px repeat(7,minmax(96px,1fr));gap:6px;min-width:840px}
.escala .h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:4px}
.escala .n{font-weight:600;padding:8px 6px;display:flex;align-items:center}
.escala select{padding:7px 6px;font-size:12px;font-weight:600;border-color:transparent}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}

.steps{counter-reset:s;display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:36px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--display);font-weight:700;display:grid;place-items:center}
details{border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
details+details{margin-top:8px}
summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:"+";color:var(--muted)}details[open] summary::after{content:"–"}
details .body{padding:0 16px 14px;color:var(--muted)}
.progress{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent)}
.plan{display:flex;flex-direction:column;gap:12px;position:relative}
.plan.hl{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.plan .price{font-family:var(--display);font-size:30px;font-weight:700}.plan .price small{font-size:13px;color:var(--muted);font-weight:500}
.plan ul{margin:0;padding-left:18px;color:var(--muted)}
.plan .tag{position:absolute;top:-10px;right:14px;background:var(--accent);color:var(--accent-fg);font-size:11px;font-weight:600;padding:2px 10px;border-radius:99px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.list-edit{display:flex;flex-direction:column;gap:6px}
.list-edit .it{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--surface-2);border-radius:8px}
.list-edit .it b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.logo-prev{width:88px;height:88px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--display);font-size:28px;font-weight:700;overflow:hidden;flex:none}
.logo-prev img{width:100%;height:100%;object-fit:cover}
.qrbox{background:#fff;padding:16px;border-radius:12px;display:inline-block}
.qrbox img,.qrbox canvas{display:block;max-width:100%}

/* tutorial animado */
.tut{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start}
.phone{width:260px;height:480px;border-radius:30px;background:var(--bg);border:10px solid var(--fg);box-shadow:0 16px 40px rgba(0,0,0,.3);flex:none;display:flex;flex-direction:column;gap:10px;padding:14px 12px;overflow:hidden}
.ph-bar{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ph-clock{font-family:var(--display);font-size:40px;font-weight:700;text-align:center;margin:8px 0}
.ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ph-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 8px;font-weight:600;font-size:14px;display:flex;flex-direction:column;gap:2px;opacity:.55}
.ph-btn small{font-weight:500;color:var(--muted);font-size:11px}
.ph-btn.next{opacity:1;border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.ph-btn.done{opacity:1;background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.ph-ok{background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:10px;font-weight:600;font-size:13px;text-align:center}
.ph-form{display:flex;flex-direction:column;gap:10px;font-size:12px;color:var(--muted)}
.ph-form label{display:flex;flex-direction:column;gap:4px}
.ph-input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--fg);font-size:14px}
.ph-cta{background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:12px;text-align:center;font-weight:600;font-size:14px}
.ph-logo{width:48px;height:48px;border-radius:12px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;margin:10px auto;overflow:hidden}
.ph-logo img{width:100%;height:100%;object-fit:cover}
.ph-qr{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#111;border-radius:12px;color:#fff}
.ph-qrbox{width:120px;height:120px;border:3px solid #fff;border-radius:8px;background:repeating-conic-gradient(#fff 0 25%,#000 0 50%) 0 0/24px 24px;outline:4px solid var(--accent);outline-offset:8px}
.ph-hint{font-size:13px;background:var(--accent);color:var(--accent-fg);padding:6px 12px;border-radius:99px}
.ph-fim{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
.ph-fim b{font-family:var(--display);font-size:20px}.ph-fim small{color:var(--muted)}
.caret{border-right:2px solid var(--accent);animation:blink 1s steps(1) infinite}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes blink{50%{border-color:transparent}}
@media (max-width:700px){.tut{grid-template-columns:1fr}.phone{margin:0 auto}}
@media (prefers-reduced-motion:reduce){.pulse,.caret{animation:none}}
/* login / quick punch */
.login{min-height:100%;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login .box{width:min(420px,100%);display:flex;flex-direction:column;gap:16px}
.login .card{padding:26px}
.bigpunch{width:100%;border:0;border-radius:16px;padding:28px;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-size:22px;font-weight:700;display:flex;flex-direction:column;gap:6px;align-items:center}
.bigpunch small{font-family:var(--body);font-weight:500;font-size:13px;opacity:.85}

.ai-fab{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;border:0;background:var(--accent);color:var(--accent-fg);border-radius:99px;padding:12px 18px;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.ai-panel{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:55;width:min(380px,calc(100vw - 40px));height:min(540px,calc(100vh - 80px));background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;box-shadow:0 16px 48px rgba(0,0,0,.22);overflow:hidden}
.ai-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ai-head b{font-family:var(--display)}.ai-head button{margin-left:auto;border:0;background:none;color:var(--muted);font-size:18px}
.ai-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;white-space:pre-wrap;font-size:13px;line-height:1.5}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}
.ai-sug{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.ai-sug button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 10px;font-size:12px;color:var(--muted)}
.ai-form{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;width:min(680px,100%);max-height:90vh;overflow-y:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.contract-text{font-size:13px;color:var(--muted);line-height:1.6;max-height:280px;overflow-y:auto;padding:12px;background:var(--surface-2);border-radius:8px}

@media (max-width:860px){
  .g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  nav.rail{position:fixed;right:0;top:0;bottom:0;height:auto;transform:translateX(100%);transition:transform .2s;z-index:80;box-shadow:-8px 0 30px rgba(0,0,0,.25)}
  nav.rail.open{transform:none}
  .menu-btn{display:inline-flex}
  .punch-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .clock{font-size:44px}
}
@media (max-width:520px){.g2,.g3,.g4{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){nav.rail{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="aiRoot" hidden>

</div>

 colab:{titulo:"Termo de Autorização de Registro Eletrônico de Ponto e Consentimento LGPD",texto:(u)=>{const E=cnpjDe(u);return `Eu, {NOME}, CPF {CPF}, colaborador(a) de ${E.razao} (CNPJ ${E.cnpj}), declaro que li, entendi e AUTORIZO o que segue:

1. REGISTRO ELETRÔNICO DA JORNADA
1.1. Autorizo o registro da minha jornada de trabalho por meio eletrônico no sistema PontoClaro, com fundamento no art. 74, §2º, da CLT (redação da Lei 13.874/2019) e na Portaria MTP nº 671/2021, que admitem o registro de ponto por sistema eletrônico, inclusive por aplicativo e dispositivo móvel.
1.2. O registro é feito por meio de login pessoal (CPF e senha), e cada marcação fica gravada com data, hora, minuto e identificação do responsável. Minha senha é pessoal e intransferível; comprometo-me a não compartilhá-la.
1.3. Quando a empresa adotar o registro por exceção (CLT art. 74, §4º), os dias sem marcação serão considerados como jornada normal do turno em que estou escalado, cabendo o registro apenas das exceções (faltas, atrasos, horas extras, atestados); concordo expressamente com essa forma de registro.
1.4. Marcações feitas por mim são de minha responsabilidade. Correções feitas pela empresa ficam registradas em histórico com autor, data e justificativa, ao qual tenho acesso.

2. USO DO CELULAR PESSOAL (FACULTATIVO)
2.1. O uso do meu aparelho celular pessoal para registrar o ponto é OPCIONAL e uma comodidade a mim oferecida. A empresa disponibiliza meio alternativo gratuito de registro (QR Code ou dispositivo da empresa na portaria/setor), que posso usar a qualquer momento, sem prejuízo.
2.2. O uso do aparelho pessoal não gera obrigação de permanecer disponível fora do horário de trabalho, não caracteriza sobreaviso, tempo à disposição ou controle da minha vida pessoal, e não autoriza a empresa a acessar fotos, mensagens, contatos ou quaisquer outros dados do aparelho.
2.3. O sistema registra apenas: data e hora da marcação, identificação do usuário e, somente se eu autorizar expressamente na configuração do aparelho, a localização aproximada no momento da marcação. Nenhum outro dado do celular é coletado.
2.4. Não há custo adicional para mim: o sistema consome tráfego de dados mínimo e, quando disponível, a empresa oferece rede Wi-Fi para o registro.

3. PROTEÇÃO DE DADOS (LGPD – Lei nº 13.709/2018)
3.1. Dados tratados: nome, CPF, cargo, equipe, horários de marcação, escalas, atestados e justificativas que eu enviar, e progresso em treinamentos.
3.2. Finalidades e bases legais: cumprimento de obrigação legal e regulatória do empregador (art. 7º, II), execução do contrato de trabalho (art. 7º, V) e exercício regular de direitos (art. 7º, VI). Documentos de saúde (atestados) são dados sensíveis tratados exclusivamente para cumprimento de obrigação legal trabalhista (art. 11, II, "a"), com acesso restrito ao RH e ao líder imediato.
3.3. Compartilhamento: os dados são compartilhados apenas com o contador/folha de pagamento da empresa e com órgãos públicos quando exigido por lei. Não há venda ou uso comercial dos meus dados.
3.4. Armazenamento e segurança: os dados ficam armazenados com controle de acesso por perfil, senha criptografada e registro de alterações (art. 46). São guardados pelo prazo legal (mínimo de 5 anos após o fim do contrato, conforme CLT art. 11 e Portaria 671) e depois eliminados.
3.5. Meus direitos (art. 18): posso solicitar à empresa confirmação do tratamento, acesso, correção de dados incompletos ou desatualizados, informação sobre compartilhamento e, quando aplicável, eliminação. Para isso, falo com o RH ou com o(a) responsável: ${S.empresa.email}.
3.6. A empresa é a CONTROLADORA dos dados; o PontoClaro atua como OPERADOR, tratando os dados somente conforme as instruções da empresa (art. 39).

4. DISPOSIÇÕES GERAIS
4.1. Posso revogar a autorização de uso do celular pessoal a qualquer tempo, por escrito, passando a usar o meio alternativo da empresa, sem qualquer penalidade.
4.2. Este termo não altera meu contrato de trabalho, salário, jornada ou direitos; apenas define o meio de registro da jornada e a forma de tratamento dos dados.
4.3. Este aceite é registrado eletronicamente com data, hora e identificação do meu login, valendo como assinatura eletrônica (Lei 14.063/2020, art. 4º, I).

Versão ${TERMOS_VERSAO}.`}},
 adesao:{titulo:"Contrato de Adesão ao PontoClaro (Termos de Uso)",texto:()=>`CONTRATANTE: ${S.cnpjs.map(c=>`${c.razao}, CNPJ ${c.cnpj}, ${c.endereco}`).join("; e ")} (em conjunto, "EMPRESA"; um único plano cobre todos os CNPJs do grupo, cobrado pelo total de colaboradores ativos).
CONTRATADA: PontoClaro Tecnologia ("PONTOCLARO"), prestadora do serviço de software de controle de jornada, escalas, treinamentos e documentos ("SISTEMA").

1. OBJETO
1.1. Licença de uso do SISTEMA, na modalidade de assinatura mensal, conforme o plano escolhido (Básico, Profissional ou Empresa), com os limites de colaboradores e recursos descritos em "Ofertas e planos".
1.2. O SISTEMA é ferramenta de GESTÃO INTERNA de jornada. A substituição do registrador de ponto oficial exigido pela Portaria MTP 671/2021 (REP) depende da contratação do módulo de registro eletrônico (plano Empresa) e, para sistema alternativo, de previsão em acordo ou convenção coletiva, conforme a legislação. A EMPRESA é responsável por verificar a adequação à sua categoria e convenção.

2. PLANOS, PAGAMENTO E CANCELAMENTO
2.1. A assinatura é mensal, cobrada antecipadamente. Pacotes semestrais ou anuais podem ter desconto, conforme proposta aceita.
2.2. A EMPRESA pode cancelar a qualquer momento, com efeito ao fim do período já pago, sem multa. Em pacotes com desconto, o cancelamento antecipado implica apenas a perda do desconto proporcional, sem outras penalidades.
2.3. Em caso de inadimplência superior a 15 dias, o acesso pode ser suspenso, mantendo-se os dados disponíveis para exportação por 90 dias.

3. OBRIGAÇÕES DA EMPRESA
3.1. Cadastrar dados corretos, manter sigilo das senhas de gestores, colher dos colaboradores o Termo de Autorização disponível no SISTEMA e observar a legislação trabalhista aplicável.
3.2. Configurar corretamente jornadas, percentuais de hora extra, adicional noturno e feriados: os cálculos do SISTEMA são automáticos a partir dessas configurações e servem de apoio, não substituindo a conferência da folha de pagamento pelo contador.

4. OBRIGAÇÕES DO PONTOCLARO
4.1. Manter o SISTEMA disponível, com meta de 99% de disponibilidade mensal, salvo manutenções programadas avisadas com 24h de antecedência.
4.2. Prestar suporte em dias úteis, das 8h às 18h, pelos canais da Central de ajuda.
4.3. Permitir, a qualquer tempo, a exportação dos dados da EMPRESA (Excel/PDF).

5. PROTEÇÃO DE DADOS (LGPD – Lei 13.709/2018)
5.1. A EMPRESA é a CONTROLADORA dos dados pessoais de seus colaboradores; o PONTOCLARO é o OPERADOR e trata os dados exclusivamente conforme as instruções da EMPRESA e para a finalidade deste contrato (art. 39).
5.2. O PONTOCLARO adota medidas técnicas e administrativas de segurança (art. 46): criptografia de senhas, controle de acesso por perfil, registro de alterações e cópias de segurança.
5.3. O PONTOCLARO não vende, cede ou utiliza os dados para fins próprios, não realiza perfilamento dos colaboradores e comunica à EMPRESA, em até 48 horas, qualquer incidente de segurança que possa acarretar risco aos titulares (art. 48).
5.4. Ao término do contrato, os dados são devolvidos à EMPRESA e eliminados em até 30 dias, salvo guarda exigida por lei.

6. RESPONSABILIDADE
6.1. O PONTOCLARO não responde por informações inseridas incorretamente, por configurações feitas pela EMPRESA, nem por decisões trabalhistas tomadas com base nos relatórios, que têm caráter de apoio à gestão.
6.2. A responsabilidade total do PONTOCLARO limita-se ao valor pago pela EMPRESA nos 12 meses anteriores ao evento.

7. DISPOSIÇÕES FINAIS
7.1. Este contrato é aceito eletronicamente pelo gestor responsável, com registro de data, hora e login, valendo como assinatura eletrônica (Lei 14.063/2020).
7.2. Alterações nestes termos serão comunicadas com 30 dias de antecedência; a continuidade do uso implica aceite.
7.3. Fica eleito o foro da comarca da sede da EMPRESA.

Versão ${TERMOS_VERSAO}.`},
 privacidade:{titulo:"Política de Privacidade e Proteção de Dados",texto:()=>`Esta política explica, em linguagem simples, como ${S.empresa.razao} (CNPJ ${S.empresa.cnpj}) trata os dados pessoais no sistema PontoClaro, conforme a Lei Geral de Proteção de Dados (LGPD, Lei 13.709/2018).

QUAIS DADOS USAMOS
• Identificação: nome, CPF, cargo, equipe, data de admissão.
• Jornada: horários de entrada e saída, escalas, horas extras, faltas e correções.
• Justificativas: atestados, declarações e observações que o colaborador enviar.
• Treinamentos: módulos concluídos e datas.
• Acesso: login, senha (guardada criptografada, ninguém consegue ver) e histórico de alterações.

PARA QUE USAMOS
• Cumprir a lei trabalhista (controle de jornada, CLT art. 74).
• Calcular a folha de pagamento (horas, extras, adicional noturno, descontos).
• Organizar escalas, treinamentos e documentos.
Base legal: obrigação legal e execução do contrato de trabalho (LGPD art. 7º, II e V). Atestados são dados sensíveis, usados só para cumprir obrigação trabalhista (art. 11, II, "a").

QUEM VÊ O QUÊ
• Colaborador: só os próprios dados.
• Líder de equipe: dados da própria equipe.
• Gestor/RH: todos os dados da empresa.
• Contador/folha de pagamento: resumos mensais necessários ao pagamento.
• Órgãos públicos: apenas quando exigido por lei (fiscalização do trabalho, Justiça).
Não vendemos nem cedemos dados a terceiros para publicidade.

CELULAR PESSOAL
Usar o celular pessoal para bater ponto é opcional. O sistema não acessa fotos, mensagens, contatos ou localização (salvo se o colaborador autorizar a localização no aparelho). A empresa oferece alternativa gratuita de registro.

POR QUANTO TEMPO
Pelo prazo exigido por lei (mínimo 5 anos após o fim do contrato). Depois, os dados são eliminados.

SEUS DIREITOS (LGPD art. 18)
Confirmar o tratamento, acessar, corrigir, saber com quem compartilhamos e pedir eliminação quando cabível. Fale com o RH: ${S.empresa.email} · ${S.empresa.tel}.

SEGURANÇA
Senhas criptografadas, acesso por perfil, histórico de correções e cópias de segurança. Em caso de incidente com risco aos titulares, a empresa comunica os afetados e a ANPD (art. 48).

Versão ${TERMOS_VERSAO}.`}

function nightMinutes(a,b){ // minutos de [a,b) dentro de 22:00–05:00 (b pode cruzar meia-noite)
  const ni=toMin(S.regras.notIni),nf=toMin(S.regras.notFim);if(b<a)b+=1440;let n=0;

function calc(p,d,uid){
  const R=S.regras,type=d?dayType(d):"semana";
  const tt=uid&&d&&S.escala[uid]?turno(S.escala[uid][dow(d)]):null,tm=tt&&tt.id!=="F"?turnoMin(tt):0;
  const J=type==="semana"?(tm||toMin(R.jornada)):type==="sabado"?(tm||toMin(R.jornadaSab)):0;
  const pct=type==="semana"?R.extraSem:type==="sabado"?R.extraSab:type==="domingo"?R.extraDom:R.extraFer;
  const fe=uid&&d?feriasEm(uid,d):null;if(fe&&(!p||!p.length))return{h:0,extra:0,deb:0,not:0,pct,type,st:"FÉRIAS"};
  const ab=uid&&d?abonoFor(uid,d):null;
  if(p===undefined&&!ab&&S.regras.autoJornada&&uid&&tt&&tt.id!=="F"&&tm>0&&d<=todayStr()&&(!user(uid)?.adm||d>=user(uid).adm)&&type!=="feriado"){const pa=tt.tipo==="flex"?[]:tt.p;let n=0;if(pa[0]&&pa[1]){let a=toMin(pa[0]),b=toMin(pa[1]);if(b<a)b+=1440;n+=nightMinutes(a,b)}if(pa[2]&&pa[3]){let a=toMin(pa[2]),b=toMin(pa[3]);if(b<a)b+=1440;n+=nightMinutes(a,b)}return{h:tm,extra:0,deb:0,not:n,pct,type,st:"AUTOMÁTICO",auto:true,pa}}
  if(!p||p.length===0)return ab?{h:0,extra:0,deb:0,not:0,pct,type,st:"ABONADO",ab}:{h:0,extra:0,deb:type==="semana"?J:0,not:0,pct,type,st:type==="semana"?"FALTA":"FOLGA"};
  let h=0,not=0;
  const seg=(x,y)=>{if(x==null||y==null)return;let a=toMin(x),b=toMin(y);if(b<a)b+=1440;h+=b-a;not+=nightMinutes(a,b)};

  const extra=h-J>R.tol?h-J:0,deb=J-h>R.tol?J-h:0;

}

    <div class="card soft stack"><h3>Adicional noturno</h3><label class="f">Percentual (%)<input id="rNot" type="number" value="${R.noturno}"></label><div class="grid g2"><label class="f">Início<input id="rNI" value="${R.notIni}"></label><label class="f">Fim<input id="rNF" value="${R.notFim}"></label></div><p class="small muted">CLT: mínimo 20% entre 22h e 5h. O sistema conta só os minutos dentro dessa faixa.</p></div></div>
    <div><button class="btn primary" onclick="salvarRegras()">Salvar regras</button></div>
    <div class="card soft stack"><div class="sect-head"><div><h3>Feriados e pontos facultativos</h3><p class="small muted">Cadastre os feriados da sua cidade e estado. Marque "Conta como feriado" para pagar o adicional de feriado a quem trabalhar; desmarque em ponto facultativo ou dia de folga coletiva que não paga extra.</p></div></div>
     <div class="table-wrap"><table><thead><tr><th>Data</th><th>Nome</th><th>Tipo (opcional)</th><th>Conta como feriado?</th><th></th></tr></thead><tbody>${[...R.feriados].sort((a,b)=>a.d<b.d?-1:1).map(f=>`<tr><td class="num">${f.d.split("-").reverse().join("/")} <span class="small muted">${DAYS[dow(f.d)]}</span></td><td>${esc(f.nome)}</td><td>${f.tipo?`<span class="chip ${f.conta!==false?"warn":"neutral"}">${esc(f.tipo)}</span>`:'<span class="muted small">—</span>'}</td><td><label class="row small" style="gap:6px"><input type="checkbox" style="width:auto" ${f.conta!==false?"checked":""} onchange="feriadoDe('${f.d}').conta=this.checked;save();render()">${f.conta!==false?"Sim, paga adicional":"Não, dia normal"}</label></td><td><button class="btn sm danger" onclick="S.regras.feriados=S.regras.feriados.filter(x=>x.d!=='${f.d}');save();render()">Remover</button></td></tr>`).join("")||'<tr><td colspan="5" class="muted">Nenhum feriado cadastrado.</td></tr>'}</tbody></table></div>
     <form class="grid g4" style="align-items:end" onsubmit="event.preventDefault();addFeriado(this)"><label class="f">Data<input type="date" name="d" required></label><label class="f">Nome<input name="n" placeholder="ex.: Aniversário da cidade" required></label><label class="f">Tipo (opcional)<select name="t"><option value="">—</option><option>Nacional</option><option>Estadual</option><option>Municipal</option><option>Ponto facultativo</option><option>Folga coletiva</option><option>Feriado da empresa</option></select></label><button class="btn primary">Adicionar feriado</button></form></div>`,
   turnos:`<p class="lead">Crie quantas jornadas a empresa usar. <b>Fixa</b>: horários definidos (ex.: 07:00–12:00 e 13:30–17:18). <b>Flexível</b>: a pessoa cumpre uma carga de horas por dia em qualquer horário; o sistema só confere o total. Para jornada sem intervalo, deixe a 2ª entrada e saída em branco. Jornadas que cruzam a meia-noite funcionam normalmente.</p>
    <div class="table-wrap"><table><thead><tr><th>Cor</th><th>Nome</th><th>Tipo</th><th>Entrada</th><th>Saída</th><th>Entrada 2</th><th>Saída 2</th><th>Carga/dia</th><th></th></tr></thead><tbody>${S.turnos.filter(t=>t.id!=="F").map(t=>`<tr><td><input type="color" value="${t.cor}" style="width:44px" onchange="editTurno('${t.id}','cor',this.value)"></td><td><input value="${esc(t.nome)}" onchange="editTurno('${t.id}','nome',this.value)"></td><td><select onchange="editTurno('${t.id}','tipo',this.value);render()"><option value="fixo" ${t.tipo!=="flex"?"selected":""}>Fixa</option><option value="flex" ${t.tipo==="flex"?"selected":""}>Flexível</option></select></td>${t.tipo==="flex"?`<td colspan="4" class="small muted">Horário livre · a pessoa cumpre a carga ao lado</td>`:[0,1,2,3].map(i=>`<td><input value="${t.p[i]||""}" placeholder="--:--" style="width:80px" onchange="editTurnoP('${t.id}',${i},this.value)"></td>`).join("")}<td>${t.tipo==="flex"?`<input value="${t.carga||""}" placeholder="08:48" style="width:80px" onchange="editTurno('${t.id}','carga',this.value.trim());render()">`:`<span class="num">${fmtH(turnoMin(t))}</span>`}</td><td><button class="btn sm danger" onclick="delTurno('${t.id}')">Excluir</button></td></tr>`).join("")}</tbody></table></div>
    <div class="row"><button class="btn" onclick="S.turnos.splice(S.turnos.length-1,0,{id:'t'+Date.now(),nome:'Nova jornada',tipo:'fixo',p:['08:00','12:00','13:00','17:00'],cor:'#2a5db0',carga:''});save();render()">+ Jornada fixa</button><button class="btn" onclick="S.turnos.splice(S.turnos.length-1,0,{id:'t'+Date.now(),nome:'Flexível',tipo:'flex',p:['','','',''],cor:'#8a4b1f',carga:'08:48'});save();render()">+ Jornada flexível</button></div>

   cargos:`<p class="lead">Cargos aparecem na ficha cadastral de cada pessoa.</p><div class="list-edit">${S.cargos.map((c,i)=>`<div class="it"><b>${esc(c)}</b><button class="btn sm danger" onclick="S.cargos.splice(${i},1);save();render()">Remover</button></div>`).join("")}</div><form class="row" onsubmit="event.preventDefault();const v=this.c.value.trim();if(v){S.cargos.push(v);save();render()}"><input name="c" placeholder="Novo cargo, ex.: Motorista" style="max-width:320px"><button class="btn primary">Adicionar</button></form>`,
   equipes:`<p class="lead">As equipes agora ficam em <b>Equipe e acessos › Equipes</b>.</p><div><button class="btn" onclick="go('equipe');EQ.tab='equipes';render()">Abrir equipes</button></div>`
  };
  return `<div class="card stack"><div class="tabs">${Object.entries({dados:"Dados e identidade",regras:"Regras de horas",turnos:"Turnos",cargos:"Cargos"}).map(([k,v])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';render()">${v}</button>`).join("")}</div>${T[tab]||T.dados}</div>`;
},
relatorios(){
  const m=me(),vis0=visiblePeople(),vis=FO.cnpj?vis0.filter(u=>u.cnpj===FO.cnpj):vis0,ym="2026-11",rows=vis.map(u=>monthRow(u,ym));
  const pend=S.ajustes.filter(a=>a.st==="pendente"&&vis.some(v=>v.id===a.u));
  const tot=rows.reduce((a,r)=>({e:a.e+r.e,n:a.n+r.n,ve:a.ve+r.ve+r.vn,vd:a.vd+r.vd}),{e:0,n:0,ve:0,vd:0});
  return `<div class="grid g4"><div class="card stat"><span class="v num">${fmtH(tot.e)}</span><span class="l">horas extras no mês${(()=>{const n=records(vis.map(v=>v.id)).filter(r=>r.d.startsWith(ym)&&calc(r.p,r.d,r.u).extra>0&&!convocFor(r.u,r.d)).length;return n?` · <span style="color:var(--warn)">${n} dia(s) sem convocação</span>`:""})()}</span></div><div class="card stat"><span class="v num">${fmtH(tot.n)}</span><span class="l">horas noturnas</span></div><div class="card stat"><span class="v num">${brl(tot.ve)}</span><span class="l">a pagar (extras + noturno)</span></div><div class="card stat"><span class="v num">${brl(tot.vd)}</span><span class="l">descontos por atraso/falta</span></div></div>
  <div class="card stack"><div class="sect-head"><div><h2>Fechamento · Novembro 2026</h2>${S.cnpjs.length>1?`<div class="row" style="margin:6px 0"><select style="width:auto" onchange="FO.cnpj=this.value;render()"><option value="">Todos os CNPJs</option>${S.cnpjs.map(c=>`<option value="${c.id}" ${FO.cnpj===c.id?"selected":""}>${esc(c.apelido||c.razao)} · ${esc(c.cnpj)}</option>`).join("")}</select></div>`:""}<p class="lead">Extras calculadas pelo percentual de cada dia (útil, sábado, domingo, feriado). Noturno pelos minutos entre ${S.regras.notIni} e ${S.regras.notFim}.</p></div><div class="row"><button class="btn" onclick="toast('Planilha gerada: Fechamento_Nov2026.xlsx (exemplo)')">Exportar Excel</button><button class="btn primary" onclick="toast('Fechamento enviado para a contabilidade (exemplo)')">Enviar para folha</button></div></div>
   <div class="table-wrap"><table><thead><tr><th>Colaborador</th><th>Dias</th><th>Faltas</th><th>Total</th><th>Extras</th><th>Noturno</th><th>Débito</th><th>Saldo</th><th>Valor extras</th><th>Valor noturno</th><th>Desconto</th></tr></thead><tbody>
   ${rows.map(r=>`<tr><td><b>${esc(r.u.nome)}</b><br><span class="small muted">${brl(valorHora(r.u))}/h</span></td><td class="num">${r.dias}</td><td class="num">${r.f}</td><td class="num">${fmtH(r.h)}</td><td class="num">${fmtH(r.e)}</td><td class="num">${r.n?`<span class="chip night">${fmtH(r.n)}</span>`:"—"}</td><td class="num">${fmtH(r.d)}</td><td class="num"><b style="color:${r.e-r.d<0?"var(--bad)":"var(--ok)"}">${fmtH(r.e-r.d)}</b></td><td class="num">${brl(r.ve)}</td><td class="num">${brl(r.vn)}</td><td class="num">${brl(r.vd)}</td></tr>`).join("")}
   </tbody></table></div></div>
  <div class="card stack"><div class="sect-head"><h2>Pendências</h2><span class="chip ${pendentes()?"warn":"ok"}">${pendentes()} pendente(s)</span></div>
   ${(()=>{const at=(S.atestados||[]).filter(a=>vis.some(v=>v.id===a.u));return at.length?`<h3>Atestados e justificativas</h3><div class="table-wrap"><table><thead><tr><th>Quem</th><th>Tipo</th><th>Período</th><th>Observação</th><th>Enviado</th><th>Status</th><th></th></tr></thead><tbody>${at.map(a=>`<tr><td>${esc(user(a.u)?.nome)}</td><td>${esc(a.tipo)}${a.arquivo?` <button class="btn sm" onclick="verAnexo('${a.id}')">Ver anexo</button>`:""}</td><td class="num">${fmtD(a.ini)}${a.fim!==a.ini?" a "+fmtD(a.fim):""}</td><td class="muted small">${esc(a.obs)}</td><td class="small muted num">${esc(a.em)}</td><td>${a.st==="pendente"?'<span class="chip warn">Pendente</span>':a.st==="aprovado"?`<span class="chip ok">Aprovado</span><br><span class="small muted">${esc(a.por)}</span>`:'<span class="chip bad">Recusado</span>'}</td><td>${a.st==="pendente"?`<div class="row"><button class="btn sm primary" onclick="decidirAtestado('${a.id}','aprovado')">Aprovar</button><button class="btn sm" onclick="decidirAtestado('${a.id}','recusado')">Recusar</button></div>`:""}</td></tr>`).join("")}</tbody></table></div>`:""})()}
   <h3>Pedidos de ajuste</h3>
   ${S.ajustes.length?`<div class="table-wrap"><table><thead><tr><th>Quem</th><th>Data</th><th>Pedido</th><th>Motivo</th><th>Status</th><th></th></tr></thead><tbody>${S.ajustes.map((a,i)=>`<tr><td>${esc(user(a.u)?.nome)}</td><td class="num">${fmtD(a.d)}</td><td class="num">${esc(a.h)}</td><td class="muted small">${esc(a.motivo)}</td><td>${a.st==="pendente"?'<span class="chip warn">Pendente</span>':a.st==="aprovado"?'<span class="chip ok">Aprovado</span>':'<span class="chip bad">Recusado</span>'}</td><td>${a.st==="pendente"?`<div class="row"><button class="btn sm" onclick="decidir(${i},'aprovado')">Aprovar</button><button class="btn sm" onclick="decidir(${i},'recusado')">Recusar</button></div>`:""}</td></tr>`).join("")}</tbody></table></div>`:'<p class="muted">Nenhum pedido de ajuste.</p>'}</div>
  <div class="card stack"><div class="sect-head"><h2>Histórico de correções</h2><span class="small muted">Quem mudou o quê, e quando</span></div>${(S.log||[]).length?`<div class="table-wrap"><table><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th></tr></thead><tbody>${S.log.slice(0,30).map(l=>`<tr><td class="num small muted">${esc(l.em)}</td><td>${esc(l.quem)}</td><td>${esc(l.acao)}</td></tr>`).join("")}</tbody></table></div>`:'<p class="muted">Nenhuma correção registrada.</p>'}</div>`;
},
folha(){
  const m=me(),people=m.role==="colab"?[m]:[...visiblePeople()].filter(u=>!FO.cnpj||u.cnpj===FO.cnpj);
  if(m.role==="colab")Object.assign(FO.cols,{val:false,normais:false,extra:false,not:false,deb:false});
  const ids=folhaSel(people),C=FO.cols;

  const canEdit=m.role!=="colab";
  const [Y,M]=FO.ym.split("-").map(Number);
  const docs=ids.map(id=>{const u=user(id),D=folhaDados(u,FO.ym),tot=D.tot;
   const cell=(x,i)=>canEdit?`<input class="num" value="${x.p?.[i]||""}" placeholder="${x.c.auto&&x.c.pa?.[i]?x.c.pa[i]:"--:--"}" style="width:64px;padding:4px 6px;text-align:center" onchange="setPunch('${x.k}',${i},this.value)">`:`<span class="num ${x.c.auto?"muted":""}">${x.p?.[i]||(x.c.auto?x.c.pa?.[i]||"":"")||"—"}</span>`;
   return `<div class="card stack">
   <div class="row between"><div class="row"><div class="logo-prev" style="width:48px;height:48px;font-size:18px">${logoHTML()}</div><div><b style="font-family:var(--display);font-size:16px">${esc(cnpjDe(u).razao)}</b><div class="small muted">CNPJ ${esc(cnpjDe(u).cnpj)} · ${esc(cnpjDe(u).endereco)}</div></div></div><div class="small" style="text-align:right"><div class="eyebrow">Folha de ponto</div><b>${MESES[M-1]} de ${Y}</b></div></div>
   <div class="grid g4 small"><div><span class="muted">Colaborador</span><br><b>${esc(u.nome)}</b>${u.matricula?`<br><span class="muted">Matrícula ${esc(u.matricula)}</span>`:""}</div><div><span class="muted">CPF</span><br><b class="num">${esc(u.cpf)}</b>${u.pis?`<br><span class="muted num">PIS ${esc(u.pis)}</span>`:""}${u.ctps?`<br><span class="muted num">CTPS ${esc(u.ctps)}</span>`:""}</div><div><span class="muted">Função / Equipe</span><br><b>${esc(u.cargo)} · ${esc(equipe(u.equipe)?.nome||"—")}</b>${u.adm?`<br><span class="muted">Admissão ${u.adm.split("-").reverse().join("/")}</span>`:""}</div><div><span class="muted">Horário contratual</span><br><b>${esc(horarioContratual(u))}</b><br><span class="muted">Jornada ${S.regras.jornada}/dia · 44h semanais</span></div></div>${S.empresa.rodapeFolha?`<p class="small muted" style="border-left:3px solid var(--line);padding-left:10px">${esc(S.empresa.rodapeFolha)}</p>`:""}
   <div class="table-wrap"><table><thead><tr><th>Dia</th>${C.turno?"<th>Turno</th>":""}${C.bat?"<th>Entrada</th><th>Saída</th><th>Entrada</th><th>Saída</th>":""}${C.horas?"<th>Trabalhadas</th>":""}${C.normais?"<th>Normais</th>":""}${C.extra?"<th>Extras</th>":""}${C.not?"<th>Noturno</th>":""}${C.deb?"<th>Faltantes</th>":""}${C.sit?"<th>Situação</th>":""}${C.obs?"<th>Observação</th>":""}</tr></thead><tbody>
   ${D.days.filter(x=>C.vazios||!D.empty(x)).map(x=>`<tr style="${x.c.type!=="semana"?"background:var(--surface-2)":""}"><td class="num"><b>${pad(+x.ds.slice(8))}</b> <span class="small muted">${DAYS[dow(x.ds)]}${x.c.type==="feriado"?" · feriado":""}</span></td>${C.turno?`<td><span class="sw" style="background:${turno(x.tid)?.cor||'#999'}"></span>${esc(turno(x.tid)?.nome||"—")}</td>`:""}${C.bat?[0,1,2,3].map(i=>`<td>${cell(x,i)}</td>`).join(""):""}${C.horas?`<td class="num">${x.p||x.c.auto?fmtH(x.c.h):"—"}</td>`:""}${C.normais?`<td class="num">${x.p||x.c.auto?fmtH(x.c.h-x.c.extra):"—"}</td>`:""}${C.extra?`<td class="num">${x.p&&x.c.extra?`${fmtH(x.c.extra)} <span class="small muted">+${x.c.pct}%${convocFor(u.id,x.ds)?" ✓":""}</span>`:"—"}</td>`:""}${C.not?`<td class="num">${x.p&&x.c.not?fmtH(x.c.not):"—"}</td>`:""}${C.deb?`<td class="num">${x.p&&x.c.deb?fmtH(x.c.deb):"—"}</td>`:""}${C.sit?`<td>${x.p||x.c.st==="ABONADO"||x.c.auto?chip(x.c.st):x.tid==="F"?'<span class="chip neutral">Folga</span>':'<span class="chip neutral">Sem registro</span>'}</td>`:""}${C.obs?`<td>${canEdit?`<input value="${esc(x.obs)}" style="padding:4px 6px;min-width:140px" onchange="S.obs['${x.k}']=this.value;save()">`:esc(x.obs||"")}</td>`:""}</tr>`).join("")}
   </tbody><tfoot><tr style="background:var(--surface-2);font-weight:700"><td>TOTAL DO MÊS</td>${C.turno?"<td></td>":""}${C.bat?`<td colspan="4" class="small muted" style="font-weight:500">${tot.dias} dia(s) trabalhado(s)${tot.auto?` (${tot.auto} automático)`:""} · ${tot.f} falta(s) · ${tot.ab} abonado(s)</td>`:""}${C.horas?`<td class="num">${fmtH(tot.h)}</td>`:""}${C.normais?`<td class="num">${fmtH(tot.h-tot.e)}</td>`:""}${C.extra?`<td class="num">${fmtH(tot.e)}</td>`:""}${C.not?`<td class="num">${fmtH(tot.n)}</td>`:""}${C.deb?`<td class="num">${fmtH(tot.d)}</td>`:""}${C.sit?`<td class="num">${veHoras()?"Saldo "+fmtH(tot.e-tot.d):""}</td>`:""}${C.obs?"<td></td>":""}</tr></tfoot></table></div>
   ${veHoras()?`<div class="grid g4"><div class="card soft stat"><span class="v num">${fmtH(tot.h-tot.e)}</span><span class="l">horas normais</span></div><div class="card soft stat"><span class="v num">${fmtH(tot.e)}</span><span class="l">horas extras${C.val?` · ${brl(tot.ve)}`:""}</span></div><div class="card soft stat"><span class="v num">${fmtH(tot.d)}</span><span class="l">horas faltantes${C.val?` · desconto ${brl(tot.vd)}`:""}</span></div><div class="card soft stat"><span class="v num" style="color:${tot.e-tot.d<0?"var(--bad)":"var(--ok)"}">${fmtH(tot.e-tot.d)}</span><span class="l">saldo do mês${C.val?` · noturno ${brl(tot.vn)}`:""}</span></div></div>`:`<div class="grid g2"><div class="card soft stat"><span class="v num">${fmtH(tot.h)}</span><span class="l">horas trabalhadas no mês</span></div><div class="card soft stat"><span class="v num">${tot.dias}</span><span class="l">dias trabalhados · ${tot.f} falta(s) · ${tot.ab} abonado(s)</span></div></div>`}
   ${C.ass?`<div class="grid g2" style="margin-top:20px"><div style="border-top:1px solid var(--fg);padding-top:6px" class="small">${esc(u.nome)}<br><span class="muted">Colaborador(a)</span></div><div style="border-top:1px solid var(--fg);padding-top:6px" class="small">${esc(cnpjDe(u).razao)}<br><span class="muted">Responsável · ${esc(m.nome)}</span></div></div>`:""}
  </div>`}).join("");

// ===================== AÇÕES =====================
function addDays(d,n){const[y,m,dd]=d.split("-").map(Number);const x=new Date(y,m-1,dd+n);return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`}
function turnoMin(t){if(!t)return 0;if(t.tipo==="flex")return toMin(t.carga)||0;let h=0;const seg=(a,b)=>{if(!a||!b)return;let x=toMin(a),y=toMin(b);if(y<x)y+=1440;h+=y-x};seg(t.p[0],t.p[1]);seg(t.p[2],t.p[3]);return h}
function punchList(p,d){const L=["Entrada","Saída para almoço","Volta do almoço","Saída"];const c=calc(p,d,me().id);return `<div class="stack">${L.map((l,i)=>`<div class="row between"><span>${l}</span><b class="num">${p[i]||'<span class="muted">—</span>'}</b></div>`).join("")}<div class="row between" style="border-top:1px solid var(--line);padding-top:8px"><span>Horas até agora</span><b class="num">${fmtH(c.h)}</b></div>${c.not&&veHoras()?`<div class="row between"><span>Horas noturnas</span><span class="chip night">${fmtH(c.not)}</span></div>`:""}${p.length===4?`<div class="row between"><span>Situação</span>${chip(c.st)}</div>`:""}</div>`}
function punchButtons(p){const L=[["Entrada","Início do expediente"],["Saída almoço","Pausa para refeição"],["Volta almoço","Retorno do intervalo"],["Saída","Fim do expediente"]];return L.map(([t,k],i)=>{const done=!!p[i],next=p.length===i;return `<button class="punch ${done?"done":next?"next":""}" ${done||!next?"disabled":""} onclick="punch()"><span class="t num">${done?p[i]:next?"Bater":"—"}</span><span>${t}</span><span class="k">${done?"Registrado":k}</span></button>`}).join("")}
function punch(){const m=me(),k=`${m.id}|${todayStr()}`;const p=S.punches[k]||[];if(p.length>=4){toast("Dia já encerrado");return}p.push(nowHM());S.punches[k]=p;save();toast(["Entrada registrada","Saída para almoço registrada","Volta registrada","Saída registrada. Bom descanso!"][p.length-1]);render()}
function pedirAjuste(){modal(`<h2>Solicitar ajuste de ponto</h2><p class="muted">Explique o que aconteceu. Seu líder recebe o pedido e aprova no fechamento.</p><label class="f">Data<input type="date" id="ajD" value="${todayStr()}"></label><label class="f">Horário correto<input id="ajH" placeholder="ex.: Entrada 07:00"></label><label class="f">Motivo<textarea id="ajM" rows="3" placeholder="ex.: Esqueci de bater a entrada, cheguei junto com o Carlos"></textarea></label><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="enviarAjuste()">Enviar pedido</button></div>`)}
function enviarAjuste(){const d=document.getElementById("ajD").value,h=document.getElementById("ajH").value.trim(),mo=document.getElementById("ajM").value.trim();if(!h||!mo){toast("Preencha horário e motivo");return}S.ajustes.unshift({u:me().id,d,h,motivo:mo,st:"pendente"});save();closeModal();toast("Pedido enviado ao seu líder");render()}
function decidir(i,st){S.ajustes[i].st=st;save();toast(st==="aprovado"?"Ajuste aprovado":"Ajuste recusado");render()}
function setPunch(k,i,v){v=v.trim();if(v&&!/^\d{1,2}:\d{2}$/.test(v)){toast("Use o formato HH:MM");render();return}const p=S.punches[k]||["","","",""];while(p.length<4)p.push("");p[i]=v;const [uu,dd]=k.split("|");if(p.every(x=>!x))delete S.punches[k];else S.punches[k]=p;if(me().role!=="colab")logar(`Corrigiu ${["entrada","saída almoço","volta almoço","saída"][i]} de ${user(uu)?.nome} em ${fmtD(dd)}: ${v||"apagado"}`);save();render();toast("Registro atualizado")}
let IMP={rows:[],busy:false};
function importarRelogio(){IMP={rows:[],busy:false};modal(`<h2>Importar do relógio de ponto físico</h2><p class="muted">Tire uma foto da folha ou do comprovante impresso pelo relógio (ou envie o PDF do relatório). A ${esc(S.empresa.assistente)} lê os horários e você confere antes de gravar.</p><label class="f">Foto ou PDF<input type="file" id="impFile" accept="image/*,application/pdf" multiple onchange="impLer(this)"></label><div id="impOut"><p class="small muted">Dica: foto nítida, de cima, com o nome e as datas visíveis. Pode enviar várias fotos de uma vez.</p></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Fechar</button></div>`)}
async function pdfParaImagens(file){if(!window.pdfjsLib){throw{code:"nopdf"}}pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const out=[];for(let i=1;i<=Math.min(pdf.numPages,4);i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:1.6});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.9)))}return out}
async function impLer(inp){const files=[...inp.files];if(!files.length)return;const out=document.getElementById("impOut");out.innerHTML='<p class="muted">Preparando arquivos…</p>';let imgs=[];try{for(const f of files){if(f.type==="application/pdf")imgs.push(...await pdfParaImagens(f));else imgs.push(f)}}catch(e){out.innerHTML='<p style="color:var(--bad)">Não consegui abrir o PDF aqui. Tire uma foto da folha e envie como imagem.</p>';return}
 let sampleFn2=null;try{sampleFn2=window.claude?.use?await claude.use("sample"):null}catch(e){}if(!sampleFn2){out.innerHTML='<p style="color:var(--bad)">A leitura automática precisa da IA, que não está disponível nesta visualização. Use "Corrigir ponto de alguém" para lançar manualmente.</p>';return}
 const lim=await sampleFn2.limits().catch(()=>null);if(!lim?.images){out.innerHTML='<p style="color:var(--bad)">Este aparelho não permite enviar imagens para a IA. Tente pelo computador ou lance manualmente.</p>';return}
 imgs=imgs.slice(0,lim.images.maxCount||4);out.innerHTML='<p class="muted">Lendo os horários… (pode levar até 1 minuto)</p>';
 const nomes=visiblePeople().map(v=>v.nome);
 const prompt=`As imagens são folhas ou comprovantes de um relógio de ponto físico de uma empresa brasileira. Extraia TODAS as marcações de ponto que conseguir ler. Funcionários conhecidos (use exatamente estes nomes quando reconhecer, mesmo com abreviações ou PIS): ${nomes.join("; ")}. Se o nome não bater com nenhum, use o nome como está escrito. Datas no formato AAAA-MM-DD (se o ano não aparecer, use ${todayStr().slice(0,4)}); horários HH:MM em 24h, em ordem cronológica, no máximo 4 por dia (entrada, saída almoço, volta, saída). Responda SOMENTE com um JSON array: [{"nome":"...","data":"AAAA-MM-DD","batidas":["07:00","12:00","13:30","17:18"]}]. Sem comentários.`;
 try{const rows=await sampleFn2.json(prompt,{images:imgs,modelTier:"default"});if(!Array.isArray(rows)||!rows.length)throw{code:"vazio"};IMP.rows=rows.filter(r=>r&&r.data&&Array.isArray(r.batidas)).map(r=>{const u=visiblePeople().find(v=>v.nome.toLowerCase()===String(r.nome||"").toLowerCase())||visiblePeople().find(v=>v.nome.toLowerCase().split(" ")[0]===String(r.nome||"").toLowerCase().split(" ")[0]);return{nome:r.nome,uid:u?.id||"",d:String(r.data),p:r.batidas.slice(0,4).map(x=>String(x).trim()),sel:true}});impRender()}
 catch(e){out.innerHTML=`<p style="color:var(--bad)">${e?.code==="not_granted"?"Você não autorizou o uso da IA nesta página.":e?.code==="rate_limited"?"Muitas leituras seguidas; aguarde um pouco e tente de novo.":e?.code==="vazio"||e?.code==="invalid_json"?"Não encontrei marcações legíveis. Tente uma foto mais nítida e mais de perto.":"Não foi possível ler agora. Tente novamente ou lance manualmente."}</p>`}}
function impRender(){const out=document.getElementById("impOut");if(!out)return;const vis=visiblePeople();out.innerHTML=`<p class="small muted">Confira e ajuste antes de gravar. Linhas sem pessoa selecionada não são importadas.</p><div class="table-wrap"><table><thead><tr><th></th><th>Lido como</th><th>Pessoa</th><th>Data</th><th>E1</th><th>S1</th><th>E2</th><th>S2</th><th>Já existe?</th></tr></thead><tbody>${IMP.rows.map((r,i)=>`<tr><td><input type="checkbox" style="width:auto" ${r.sel?"checked":""} onchange="IMP.rows[${i}].sel=this.checked"></td><td class="small muted">${esc(r.nome)}</td><td><select onchange="IMP.rows[${i}].uid=this.value"><option value="">— escolher —</option>${vis.map(v=>`<option value="${v.id}" ${v.id===r.uid?"selected":""}>${esc(v.nome)}</option>`).join("")}</select></td><td><input type="date" value="${esc(r.d)}" style="width:140px" onchange="IMP.rows[${i}].d=this.value"></td>${[0,1,2,3].map(k=>`<td><input value="${esc(r.p[k]||"")}" placeholder="--:--" style="width:62px;padding:3px 5px;text-align:center" onchange="IMP.rows[${i}].p[${k}]=this.value.trim()"></td>`).join("")}<td>${r.uid&&S.punches[r.uid+"|"+r.d]?.length?'<span class="chip warn">Sim</span>':'<span class="chip neutral">Não</span>'}</td></tr>`).join("")}</tbody></table></div><label class="row small" style="gap:6px"><input type="checkbox" id="impSobre" style="width:auto">Substituir registros que já existem nesses dias</label><div class="row" style="justify-content:flex-end"><button class="btn primary" onclick="impGravar()">Gravar ${IMP.rows.filter(r=>r.sel).length} registro(s)</button></div>`}
function impGravar(){const sobre=document.getElementById("impSobre")?.checked;let n=0,pul=0;IMP.rows.filter(r=>r.sel&&r.uid&&/^\d{4}-\d{2}-\d{2}$/.test(r.d)).forEach(r=>{const k=r.uid+"|"+r.d;if(S.punches[k]?.length&&!sobre){pul++;return}const p=r.p.map(x=>/^\d{1,2}:\d{2}$/.test(x)?x.padStart(5,"0"):"");while(p.length<4)p.push("");if(p.every(x=>!x))return;S.punches[k]=p;S.obs[k]=S.obs[k]||"Importado do relógio físico";n++});if(n)logar(`Importou ${n} registro(s) do relógio físico (foto/PDF)`);save();closeModal();render();toast(`${n} registro(s) gravado(s)${pul?` · ${pul} pulado(s) por já existirem`:""}`)}
function lancarFerias(){const vis=visiblePeople();modal(`<h2>Lançar férias</h2><p class="muted">Os dias entram na folha como FÉRIAS, sem desconto. Lembre o aviso ao colaborador com 30 dias de antecedência (CLT art. 135).</p><div class="grid g3"><label class="f">Colaborador<select id="feU">${vis.map(v=>`<option value="${v.id}">${esc(v.nome)}</option>`).join("")}</select></label><label class="f">Início<input type="date" id="feI" value="${todayStr()}"></label><label class="f">Dias corridos<input type="number" id="feN" value="30" min="5" max="30"></label></div><label class="f">Observação<input id="feO" placeholder="ex.: 1º período, 20 dias + abono"></label><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="feSave()">Lançar</button></div>`)}
function feSave(){const u=document.getElementById("feU").value,ini=document.getElementById("feI").value,n=Number(document.getElementById("feN").value)||30;if(!ini)return;const fim=addDays(ini,n-1);S.ferias.push({id:"f"+Date.now(),u,ini,fim,obs:document.getElementById("feO").value.trim(),por:me().nome});logar(`Lançou férias de ${user(u)?.nome}: ${fmtD(ini)} a ${fmtD(fim)}`);save();closeModal();render();toast("Férias lançadas")}
function lancarASO(uid){const a=(S.aso||{})[uid]||{};modal(`<h2>Registrar exame ASO · ${esc(user(uid)?.nome)}</h2><div class="grid g3"><label class="f">Data do exame<input type="date" id="asD" value="${a.ultimo||todayStr()}"></label><label class="f">Tipo<select id="asT">${["Admissional","Periódico","Retorno ao trabalho","Mudança de função","Demissional"].map(x=>`<option ${x===a.tipo?"selected":""}>${x}</option>`).join("")}</select></label><label class="f">Validade (meses)<input type="number" id="asM" value="${a.meses||12}" min="1" max="24"></label></div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="S.aso['${uid}']={ultimo:document.getElementById('asD').value,tipo:document.getElementById('asT').value,meses:Number(document.getElementById('asM').value)||12};logar('Registrou ASO de ${esc(user(uid)?.nome)}');save();closeModal();render();toast('Exame registrado')">Salvar</button></div>`)}
function fichaGuia(id){const g=id?S.guias.find(x=>x.id===id):{id:"",cnpj:GU.cnpj||S.cnpjs[0]?.id,nome:"",valor:"",venc:todayStr(),pago:false,obs:"",repete:false};modal(`<h2>${id?"Editar guia":"Nova guia ou conta"}</h2><div class="grid g2"><label class="f">Nome<input id="guN" value="${esc(g.nome)}" placeholder="ex.: DAS, FGTS, Energia, Aluguel"></label><label class="f">Empresa (CNPJ)<select id="guC">${S.cnpjs.map(c=>`<option value="${c.id}" ${c.id===g.cnpj?"selected":""}>${esc(c.apelido||c.razao)}</option>`).join("")}</select></label><label class="f">Valor (R$)<input id="guV" type="number" step="0.01" value="${g.valor}"></label><label class="f">Vencimento<input id="guD" type="date" value="${g.venc}"></label></div><label class="f">Observação<input id="guO" value="${esc(g.obs||"")}"></label><label class="row small" style="gap:6px"><input type="checkbox" id="guR" style="width:auto" ${g.repete?"checked":""}>Repetir mensalmente (ao pagar, cria a do mês seguinte)</label><div class="row between"><div>${id?`<button class="btn danger" onclick="S.guias=S.guias.filter(x=>x.id!=='${id}');save();closeModal();render()">Excluir</button>`:""}</div><div class="row"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="guSave('${id||""}')">Salvar</button></div></div>`)}
function guSave(id){const g=x=>document.getElementById(x).value;const d={nome:g("guN").trim(),cnpj:g("guC"),valor:Number(g("guV"))||0,venc:g("guD"),obs:g("guO").trim(),repete:document.getElementById("guR").checked};if(!d.nome||!d.venc){toast("Informe nome e vencimento");return}if(id)Object.assign(S.guias.find(x=>x.id===id),d);else S.guias.push({id:"g"+Date.now(),pago:false,...d});save();closeModal();render();toast("Guia salva")}
function pagarGuia(id,pago){const g=S.guias.find(x=>x.id===id);if(!g)return;g.pago=pago;if(pago)g.pagoEm=todayStr();if(pago&&g.repete&&!S.guias.some(x=>x.nome===g.nome&&x.cnpj===g.cnpj&&x.venc===addMeses(g.venc,1))){S.guias.push({...g,id:"g"+Date.now(),pago:false,pagoEm:undefined,venc:addMeses(g.venc,1)})}logar(`${pago?"Pagou":"Reabriu"} a guia ${g.nome} (${brl(g.valor)})`);save();render();toast(pago?"Marcada como paga"+(g.repete?" · próxima criada":""):"Guia reaberta")}
function marcarFalta(uid,d){const k=uid+"|"+d;S.punches[k]=[];S.obs[k]=S.obs[k]||"Falta";logar(`Marcou falta de ${user(uid)?.nome} em ${fmtD(d)}`);save();render();toast("Falta registrada")}
function corrigirPonto(pre,preD){const vis=visiblePeople();modal(`<h2>Corrigir ponto</h2><p class="muted">Escolha a pessoa e o dia, digite os horários corretos. Não precisa de pedido de ajuste: a correção vale na hora e fica no histórico.</p><div class="grid g2"><label class="f">Pessoa<select id="cpU">${vis.map(v=>`<option value="${v.id}" ${v.id===pre?"selected":""}>${esc(v.nome)}</option>`).join("")}</select></label><label class="f">Data<input type="date" id="cpD" value="${preD||todayStr()}" onchange="cpLoad()"></label></div><div class="grid g4">${["Entrada","Saída almoço","Volta almoço","Saída"].map((l,i)=>`<label class="f">${l}<input id="cp${i}" placeholder="--:--"></label>`).join("")}</div><label class="f">Observação<input id="cpO" placeholder="ex.: esqueceu de bater, confirmado com o líder"></label><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="cpSave()">Salvar correção</button></div>`);document.getElementById("cpU").addEventListener("change",cpLoad);cpLoad()}
function cpLoad(){const k=`${document.getElementById("cpU").value}|${document.getElementById("cpD").value}`;const p=S.punches[k]||[];[0,1,2,3].forEach(i=>document.getElementById("cp"+i).value=p[i]||"");document.getElementById("cpO").value=S.obs[k]||""}
function cpSave(){const u=document.getElementById("cpU").value,d=document.getElementById("cpD").value,k=`${u}|${d}`;const p=[0,1,2,3].map(i=>document.getElementById("cp"+i).value.trim());if(p.some(x=>x&&!/^\d{1,2}:\d{2}$/.test(x))){toast("Use o formato HH:MM");return}if(p.every(x=>!x))delete S.punches[k];else S.punches[k]=p;const o=document.getElementById("cpO").value.trim();if(o)S.obs[k]=o;else delete S.obs[k];logar(`Corrigiu o ponto de ${user(u)?.nome} em ${fmtD(d)}: ${p.filter(Boolean).join(" / ")||"apagado"}${o?" ("+o+")":""}`);save();closeModal();render();toast("Ponto corrigido")}
function enviarAtestado(){const m=me(),vis=m.role==="colab"?[m]:visiblePeople();modal(`<h2>${m.role==="colab"?"Enviar atestado":"Lançar atestado"}</h2><p class="muted">${m.role==="colab"?"Tire uma foto do atestado, marque os dias e envie. Seu líder recebe na hora.":"Lance para alguém da equipe. Fica aprovado na hora."}</p><div class="grid g2">${m.role!=="colab"?`<label class="f">Pessoa<select id="atU">${vis.map(v=>`<option value="${v.id}">${esc(v.nome)}</option>`).join("")}</select></label>`:""}<label class="f">Tipo<select id="atT"><option>Atestado médico</option><option>Declaração de comparecimento</option><option>Falecimento familiar</option><option>Folga combinada</option><option>Outro</option></select></label><label class="f">Do dia<input type="date" id="atI" value="${todayStr()}"></label><label class="f">Até o dia<input type="date" id="atF" value="${todayStr()}"></label></div><label class="f">Observação (opcional)<input id="atO" placeholder="ex.: consulta, 2 dias de repouso"></label><label class="f">Foto ou PDF do documento (opcional, até 600 KB)<input type="file" id="atA" accept="image/*,application/pdf"></label><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="atSave()">${m.role==="colab"?"Enviar":"Lançar"}</button></div>`)}
function atSave(){const m=me(),u=m.role==="colab"?m.id:document.getElementById("atU").value,ini=document.getElementById("atI").value,fim=document.getElementById("atF").value||ini;if(!ini||fim<ini){toast("Confira as datas");return}const f=document.getElementById("atA").files[0];const done=(arquivo)=>{S.atestados=S.atestados||[];S.atestados.unshift({id:"a"+Date.now(),u,ini,fim,tipo:document.getElementById("atT").value,obs:document.getElementById("atO").value.trim(),arquivo,st:m.role==="colab"?"pendente":"aprovado",em:new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"}),por:m.role==="colab"?"":m.nome});if(m.role!=="colab")logar(`Lançou ${document.getElementById("atT").value} para ${user(u)?.nome}: ${fmtD(ini)} a ${fmtD(fim)}`);save();closeModal();render();toast(m.role==="colab"?"Enviado! Seu líder já recebeu.":"Atestado lançado e dias abonados")};if(f){if(f.size>600*1024){toast("Arquivo até 600 KB (tire a foto em qualidade menor)");return}const r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(f)}else done("")}
function decidirAtestado(id,st){const a=S.atestados.find(x=>x.id===id);if(!a)return;a.st=st;a.por=me().nome;logar(`${st==="aprovado"?"Aprovou":"Recusou"} ${a.tipo} de ${user(a.u)?.nome} (${fmtD(a.ini)} a ${fmtD(a.fim)})`);save();render();toast(st==="aprovado"?"Aprovado: dias abonados na folha":"Recusado")}
function verAnexo(id){const a=S.atestados.find(x=>x.id===id);if(!a?.arquivo)return;modal(`<h2>${esc(a.tipo)} · ${esc(user(a.u)?.nome)}</h2>${a.arquivo.startsWith("data:application/pdf")?`<p class="muted">PDF anexado. <a href="${a.arquivo}" target="_blank">Abrir em nova aba</a></p>`:`<img src="${a.arquivo}" alt="" style="max-width:100%;border-radius:8px">`}<div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Fechar</button></div>`)}
function horarioContratual(u){const ids=[...new Set((S.escala[u.id]||[]).filter(x=>x!=="F"))];const tt=ids.map(turno).filter(Boolean);if(!tt.length)return "—";return tt.map(t=>t.tipo==="flex"?`${t.nome} (${fmtH(turnoMin(t))}/dia, horário livre)`:`${t.nome} ${t.p[0]}–${t.p[1]}${t.p[2]?` / ${t.p[2]}–${t.p[3]}`:""}`).join("; ")}
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function folhaSel(people){if(people.length===1)return[people[0].id];if(FO.modo==="todos")return people.map(p=>p.id);if(FO.modo==="escolher")return FO.sel.filter(id=>people.some(p=>p.id===id));if(!FO.u||!people.some(p=>p.id===FO.u))FO.u=people[0].id;return[FO.u]}
function folhaDados(u,ym){const[Y,M]=ym.split("-").map(Number),nd=new Date(Y,M,0).getDate(),days=[];
 for(let d=1;d<=nd;d++){const ds=`${ym}-${pad(d)}`,k=`${u.id}|${ds}`;days.push({ds,k,p:S.punches[k]||null,obs:S.obs[k]||"",c:calc(S.punches[k],ds,u.id),tid:(S.escala[u.id]||[])[dow(ds)]||"F"})}
 const tot=days.reduce((a,x)=>{if(x.c.st==="ABONADO")a.ab++;if(x.c.auto)a.auto=(a.auto||0)+1;if(x.p||x.c.auto){a.h+=x.c.h;a.e+=x.c.extra;a.n+=x.c.not;a.d+=x.c.deb;if(x.c.st==="FALTA")a.f++;else if(x.c.h)a.dias++;a.ve+=x.c.extra/60*valorHora(u)*(1+x.c.pct/100)}return a},{h:0,e:0,n:0,d:0,f:0,dias:0,ab:0,ve:0});
 tot.vn=tot.n/60*valorHora(u)*S.regras.noturno/100;tot.vd=tot.d/60*valorHora(u);
 return{days,tot,empty:x=>!x.p&&x.tid==="F"&&x.c.st!=="ABONADO"}}
function folhaLinhas(u){const ym=FO.ym,C=FO.cols,D=folhaDados(u,ym),L=[];
 const head=["Dia"];if(C.turno)head.push("Turno");if(C.bat)head.push("Entrada","Saída","Entrada","Saída");if(C.horas)head.push("Trabalhadas");if(C.normais)head.push("Normais");if(C.extra)head.push("Extras","% extra");if(C.not)head.push("Noturno");if(C.deb)head.push("Faltantes");if(C.sit)head.push("Situação");if(C.obs)head.push("Observação");
 const rows=D.days.filter(x=>C.vazios||!D.empty(x)).map(x=>{const p=x.p,c=x.c,r=[`${pad(+x.ds.slice(8))} ${DAYS[dow(x.ds)]}`];if(C.turno)r.push(turno(x.tid)?.nome||"");if(C.bat)r.push(...[0,1,2,3].map(i=>p?.[i]||(c.auto?c.pa?.[i]||"":"")));if(C.horas)r.push(p||c.auto?fmtH(c.h):"");if(C.normais)r.push(p||c.auto?fmtH(c.h-c.extra):"");if(C.extra)r.push(p&&c.extra?fmtH(c.extra):"",p&&c.extra?c.pct+"%":"");if(C.not)r.push(p&&c.not?fmtH(c.not):"");if(C.deb)r.push(p&&c.deb?fmtH(c.deb):"");if(C.sit)r.push(p||c.st==="ABONADO"||c.auto?(!veHoras()&&(c.st==="EXTRA"||c.st==="ATRASO")?"REGISTRADO":c.st):x.tid==="F"?"Folga":"");if(C.obs)r.push(x.obs);return r});
 const t=D.tot,tot=veHoras()?[["Total trabalhado",fmtH(t.h)],["Horas normais",fmtH(t.h-t.e)],["Horas extras",fmtH(t.e)].concat(C.val?[brl(t.ve)]:[]),["Horas noturnas",fmtH(t.n)].concat(C.val?[brl(t.vn)]:[]),["Horas faltantes",fmtH(t.d)].concat(C.val?[brl(t.vd)]:[]),["Saldo do mês",fmtH(t.e-t.d)],["Dias trabalhados / faltas / abonados",`${t.dias} / ${t.f} / ${t.ab}`]]:[["Total trabalhado",fmtH(t.h)],["Dias trabalhados / faltas / abonados",`${t.dias} / ${t.f} / ${t.ab}`]];
 const meta=[[cnpjDe(u).razao,"CNPJ "+cnpjDe(u).cnpj],["Folha de ponto",ym.split("-").reverse().join("/")],["Colaborador",u.nome+(u.matricula?" · Matrícula "+u.matricula:"")],["CPF",u.cpf+(u.pis?" · PIS "+u.pis:"")+(u.ctps?" · CTPS "+u.ctps:"")],["Função / Equipe",u.cargo+" · "+(equipe(u.equipe)?.nome||"")+(u.adm?" · Admissão "+u.adm.split("-").reverse().join("/"):"")],["Horário contratual",horarioContratual(u)]].concat(S.empresa.rodapeFolha?[["Observação",S.empresa.rodapeFolha]]:[]);
 return{meta,head,rows,tot,u,ym}}

 const r=await entregar(name,csv);if(r===null){try{await navigator.clipboard.writeText(csv);toast("Download indisponível aqui: conteúdo copiado, cole no Excel")}catch(e){toast("Não foi possível baixar neste navegador")}}}

 const r=await entregar(name,blob,`PDF salvo: ${name}`);if(r===null){const url=doc.output("bloburl");const w=window.open(url,"_blank");if(!w)modal(`<h2>PDF pronto</h2><p class="muted">Este navegador não permite salvar daqui. Abra o link e salve pelo navegador.</p><p><a href="${url}" target="_blank" class="btn primary">Abrir PDF</a></p><div class="row" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Fechar</button></div>`)}}

let tutI=0,tutTimer=null,tutTTS=null,tutVoz=false,tutCurso="";
function tutorialPonto(cid){tutCurso=cid||"";tutI=0;modal(`<div class="row between"><h2>Como bater o ponto</h2><button class="btn sm" onclick="tutStop();closeModal()">Fechar</button></div><div class="tut"><div class="phone" id="tutPhone"></div><div class="tut-side"><div class="eyebrow">Passo <span id="tutN">1</span> de ${TUT.length}</div><p id="tutCap" style="font-size:16px;line-height:1.5;min-height:96px"></p><div class="progress"><i id="tutBar" style="width:0;transition:width .4s"></i></div><div class="row"><button class="btn" id="tutPrev" onclick="tutGo(tutI-1)">◀ Anterior</button><button class="btn primary" id="tutPlay" onclick="tutToggle()">▶ Assistir</button><button class="btn" onclick="tutGo(tutI+1)">Próximo ▶</button></div><label class="row small muted" style="gap:6px"><input type="checkbox" id="tutVozChk" style="width:auto" onchange="tutVoz=this.checked;if(tutVoz)tutFalar()"> Narração em voz</label><p class="small muted" id="tutVozNota"></p>${tutCurso?`<button class="btn" onclick="tutStop();marcarFeito('${tutCurso}')">Entendi, concluir módulo</button>`:""}</div></div>`);
 tutGo(0);(async()=>{try{tutTTS=window.claude?.use?await claude.use("tts"):null}catch(e){tutTTS=null}const n=document.getElementById("tutVozNota");if(n)n.textContent=tutTTS?"":"Narração em voz indisponível neste aparelho; siga pelas legendas.";const c=document.getElementById("tutVozChk");if(c&&!tutTTS)c.disabled=true})()}
function tutTela(st){const L=["Entrada","Saída almoço","Volta almoço","Saída"],H=["07:00","12:00","13:30","17:18"];const n=st.n??0;
 const punch=`<div class="ph-bar"><b>${esc(S.empresa.nome)}</b><span>${nowHM()}</span></div><div class="ph-clock num">${H[Math.min(n,3)]}</div><div class="ph-grid">${L.map((l,i)=>`<div class="ph-btn ${i<n?"done":i===n&&!st.done?"next pulse":""}">${i<n?`<span class="num">${H[i]}</span>`:i===n?"Bater":"—"}<small>${l}</small></div>`).join("")}</div>${st.done&&n===4?'<div class="ph-ok">✓ Saída registrada · 8:48 trabalhadas</div>':st.done?'<div class="ph-ok">✓ Entrada registrada às 07:00</div>':""}`;
 const telas={qr:`<div class="ph-bar"><b>Câmera</b></div><div class="ph-qr"><div class="ph-qrbox"></div><div class="ph-hint pulse">Aponte para o QR Code</div></div>`,
  login:`<div class="ph-bar"><b>${esc(S.empresa.nome)}</b></div><div class="ph-form"><div class="ph-logo">${logoHTML()}</div><label>CPF<div class="ph-input num">333.333.333-<span class="caret">33</span></div></label><label>Senha<div class="ph-input">••••</div></label><div class="ph-cta">Entrar</div></div>`,
  punch,
  ajuste:`<div class="ph-bar"><b>Controle de ponto</b></div><div class="ph-form"><div class="ph-cta pulse" style="background:var(--surface);color:var(--fg);border:1px solid var(--line)">Solicitar ajuste</div><label>Horário correto<div class="ph-input">Entrada 07:00</div></label><label>Motivo<div class="ph-input">Esqueci de bater</div></label><div class="ph-cta">Enviar pedido</div></div>`,
  atestado:`<div class="ph-bar"><b>Controle de ponto</b></div><div class="ph-form"><div class="ph-cta pulse">Enviar atestado</div><label>Do dia · até o dia<div class="ph-input num">11/11 · 12/11</div></label><label>Foto do atestado<div class="ph-input">📷 atestado.jpg</div></label><div class="ph-cta">Enviar</div></div>`,
  fim:`<div class="ph-bar"><b>${esc(S.empresa.nome)}</b></div><div class="ph-fim"><div class="ph-logo" style="width:64px;height:64px;font-size:26px">${logoHTML()}</div><b>Bom trabalho!</b><small>Entrada · Almoço · Volta · Saída</small></div>`};
 return telas[st.tela]||punch}
function tutGo(i){if(i<0||i>=TUT.length){if(i>=TUT.length)tutStop();return}tutI=i;const st=TUT[i];const ph=document.getElementById("tutPhone");if(!ph)return;ph.innerHTML=tutTela(st);document.getElementById("tutCap").textContent=st.cap;document.getElementById("tutN").textContent=i+1;document.getElementById("tutBar").style.width=((i+1)/TUT.length*100)+"%";document.getElementById("tutPrev").disabled=i===0;if(tutVoz)tutFalar();if(tutTimer){clearTimeout(tutTimer);tutTimer=setTimeout(()=>tutGo(tutI+1),tutVoz?9000:6500)}}
function tutToggle(){const b=document.getElementById("tutPlay");if(tutTimer){tutStop();b.textContent="▶ Assistir";return}b.textContent="⏸ Pausar";tutTimer=setTimeout(()=>tutGo(tutI+1),tutVoz?9000:6500);if(tutVoz)tutFalar()}
function tutStop(){if(tutTimer)clearTimeout(tutTimer);tutTimer=null;const b=document.getElementById("tutPlay");if(b)b.textContent="▶ Assistir";try{tutTTS?.stop()}catch(e){}}
async function tutFalar(){if(!tutTTS||!tutVoz)return;try{await tutTTS.speak(TUT[tutI].fala,{language:"pt-BR",voice:"rounded"})}catch(e){if(e?.code==="not_granted"){tutVoz=false;const c=document.getElementById("tutVozChk");if(c){c.checked=false;c.disabled=true}}}}

"justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="salvarUser('${id||""}')">Salvar</button></div>`)}
async function salvarUser(id){const g=x=>document.getElementById(x).value;const cpf=g("uCpf");const v=cpfValido(cpf);if(!g("uNome").trim()){toast("Informe o nome");return}if(!v){toast("CPF inválido, confira os dígitos");return}if(S.users.some(u=>u.cpf===cpf&&u.id!==id)){toast("Já existe uma pessoa com este CPF");return}
 const data={nome:g("uNome").trim(),cpf,cnpj:g("uCnpj"),cargo:g("uCargo"),equipe:g("uEq"),role:g("uRole"),salario:Number(g("uSal"))||0,adm:g("uAdm"),ativo:g("uAtivo")==="1",matricula:g("uMat").trim(),pis:g("uPis").trim(),ctps:g("uCtps").trim(),tel:g("uTel").trim()};
 if(id){Object.assign(user(id),data)}else{const s=g("uSenha");if(!s||s.length<4){toast("Senha inicial com ao menos 4 caracteres");return}S.users.push({id:uid(),senha:await hash(s),...data})}
